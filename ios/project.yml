name: Playaway
options:
  deploymentTarget: {iOS: "26.0"}
  generateEmptyDirectories: true
packages:
  PlayawaySources:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  Playaway:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PlayawaySources
        product: PlayawayCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Playaway
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.localplayer.playlist
            UTTypeDescription: Playlist
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [lplaylist]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Playlist
            LSHandlerRank: Owner
            LSItemContentTypes: [com.localplayer.playlist]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: SANCRLNZFW
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.playaway.app
        PRODUCT_NAME: Playaway
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_SWIFT_FLAGS: "-package-name localplayer"
  PlayawayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: Playaway}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playaway.app.uitests
        TEST_TARGET_NAME: Playaway
schemes:
  Playaway:
    build: {targets: {Playaway: all}}
    test: {targets: [PlayawayUITests]}
